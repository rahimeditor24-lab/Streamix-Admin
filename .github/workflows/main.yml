name: Build Streamix Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Streamix Admin APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-project

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android Project
        run: |
          echo "Checking Android project..."
          pwd
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts
          test -f gradlew

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Create Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug keystore ready:"
          ls -lh debug.keystore

      - name: Check Gradle Version
        run: ./gradlew --version

      - name: Clean Build
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            find app/build/outputs -type f || true
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Streamix Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Admin-Debug-APK
          path: android-project/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "## Streamix Admin APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Build completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 APK: Streamix-Admin-Debug-APK" >> "$GITHUB_STEP_SUMMARY"
