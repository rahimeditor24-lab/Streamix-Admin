name: Build Streamix Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Streamix Admin APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Find Android project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          if [ -f "android-project/gradlew" ]; then
            echo "ANDROID_DIR=android-project" >> "$GITHUB_ENV"
          elif [ -f "gradlew" ]; then
            echo "ANDROID_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: gradlew not found"
            find . -maxdepth 4 -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \)
            exit 1
          fi

      # 4. Create debug.keystore
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_DIR"

          rm -f "$ANDROID_DIR/debug.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$ANDROID_DIR/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created successfully"

          ls -lh "$ANDROID_DIR/debug.keystore"

      # 5. Make Gradle executable
      - name: Make Gradle Executable
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew

      # 6. Check Gradle
      - name: Check Gradle
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew --version

      # 7. Clean
      - name: Clean Build
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew clean --no-daemon

      # 8. Build APK
      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 9. Find APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 10. Upload APK
      - name: Upload Streamix Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Admin-Debug-APK
          path: |
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 11. Build Summary
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "## Streamix Admin APK Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if find "$ANDROID_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" 2>/dev/null | grep -q .; then

            echo "✅ APK BUILD SUCCESSFUL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            find "$ANDROID_DIR/app/build/outputs/apk/debug" \
              -type f -name "*.apk" \
              -printf '%p\n' >> "$GITHUB_STEP_SUMMARY"

          else

            echo "❌ APK BUILD FAILED" >> "$GITHUB_STEP_SUMMARY"

          fi
