name: Build Streamix Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Streamix Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Streamix Admin ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Unzip Streamix Admin
        shell: bash
        run: |
          rm -rf project
          mkdir -p project
          unzip -o "${{ steps.zip.outputs.zip }}" -d project

      - name: Find Android Gradle Project
        id: project
        shell: bash
        run: |
          DIR=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

          echo "Android project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Debug Keystore
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "Debug keystore created."
          fi

      - name: Make Gradle Executable
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Admin-Debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
