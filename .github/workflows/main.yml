name: Build Streamix Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Streamix Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Android ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Android ZIP
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q "${{ steps.zip.outputs.zip }}" -d android-project

          echo "=== Extracted files ==="
          find android-project -maxdepth 3 -type f | sort

      - name: Find Gradle Project
        id: project
        shell: bash
        run: |
          PROJECT=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            find android-project -maxdepth 4 -type f
            exit 1
          fi

          echo "Gradle project found: $PROJECT"
          echo "dir=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Gradle Environment
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --version
          java -version

      - name: Clean Build
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle clean --no-daemon

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "${{ steps.project.outputs.dir }}/app/build" -type f || true
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Admin-Debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "## ✅ Streamix Admin APK Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK successfully built and uploaded." >> "$GITHUB_STEP_SUMMARY"
