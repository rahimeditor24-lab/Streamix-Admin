name: Build Streamix Admin

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Streamix Admin ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project
        shell: bash
        run: |
          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

      - name: Find Gradle Project
        shell: bash
        run: |
          PROJECT_DIR=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          GRADLE_VERSION=$(grep -Eo 'distributionUrl=.*gradle-[0-9.]+-[a-z]+\.zip' gradle/wrapper/gradle-wrapper.properties 2>/dev/null \
            | grep -Eo 'gradle-[0-9.]+' \
            | head -n 1 \
            | sed 's/gradle-//' || true)

          if [ -n "$GRADLE_VERSION" ]; then
            echo "Using Gradle $GRADLE_VERSION"
            gradle --version
          fi

          gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Streamix Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Admin-Debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
