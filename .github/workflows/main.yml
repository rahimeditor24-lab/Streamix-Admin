name: Build Streamix Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Streamix Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          unzip -q "$ZIP" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 5 -type f | head -300

      - name: Find Gradle Project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find extracted \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP."

            echo "Searching Gradle files..."
            find extracted -type f \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "================================"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew

      - name: Create Debug Keystore
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            echo "Creating debug keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Check Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "=== APK FOUND ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Admin-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build Summary
        if: success()
        run: |
          echo "======================================"
          echo " STREAMIX ADMIN APK BUILD SUCCESSFUL "
          echo "======================================"
