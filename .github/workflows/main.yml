name: Build Streamix Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Streamix Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Checking repository..."

          find . -maxdepth 4 -type f | head -300

          GRADLEW=$(find . -type f -name "gradlew" | head -n 1 || true)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found. Searching for build.gradle files..."

            find . -type f \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) -print

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew

      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug keystore ready."

      - name: Check Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        if: success()
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Admin-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Build Summary
        if: success()
        run: |
          echo "================================"
          echo "STREAMIX ADMIN APK BUILD SUCCESS"
          echo "================================"
