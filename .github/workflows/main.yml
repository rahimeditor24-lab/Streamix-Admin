name: Build Streamix Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Streamix Admin APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Find and extract Android project
      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | head -200

          # Find first ZIP
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"

            rm -rf project
            mkdir -p project

            unzip -q "$ZIP_FILE" -d project

            echo "=== Extracted files ==="
            find project -maxdepth 4 -type f | head -200
          fi

          # Find directory containing gradlew
          GRADLEW=$(find . -type f -name "gradlew" | head -n 1 || true)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            echo "The ZIP/repository does not contain a Gradle wrapper."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          chmod +x gradlew

          echo "=== Gradle files ==="
          ls -la

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Create debug keystore
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

          ls -lh "$KEYSTORE"

      # 6. Make Gradle executable
      - name: Make Gradle Executable
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew

      # 7. Show versions
      - name: Check Gradle Environment
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      # 8. Clean
      - name: Clean Build
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon

      # 9. Build Debug APK
      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # 10. Find APK
      - name: Find APK
        if: success()
        shell: bash
        run: |
          echo "=== APK FILES ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 11. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Admin-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 12. Build Summary
      - name: Build Summary
        if: success()
        shell: bash
        run: |
          echo "======================================"
          echo "       STREAMIX ADMIN APK READY"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;
