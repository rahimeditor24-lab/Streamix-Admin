name: Build Streamix Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Streamix Admin APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android ZIP not found!"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Android Project
        run: |
          set -e

          rm -rf android-project
          mkdir android-project

          unzip -q "${{ steps.zip.outputs.zip }}" -d android-project

          echo "===== PROJECT FILES ====="
          find android-project -maxdepth 5 -type f | head -150

      - name: Find Gradle Project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Gradle project not found!"
            find android-project -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Environment
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== FILES ====="
          ls -la

      - name: Clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            find . -type f -name "*.apk"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Admin-APK
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "## ✅ Streamix Admin APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK build completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "JDK: 17" >> "$GITHUB_STEP_SUMMARY"
          echo "Gradle: 9.3.1" >> "$GITHUB_STEP_SUMMARY"
